name: ci

on:
  push:
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "30 10 * * 0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # We need libpathrs so that golangci-lint can typecheck
      # "cyphar.com/go-pathrs" (the package needs to be buildable).
      - uses: dtolnay/rust-toolchain@stable
      - name: find latest libpathrs release
        uses: actions/github-script@v8
        id: libpathrs-release-tarball
        with:
          result-encoding: string
          script: |-
      - uses: Swatinem/rust-cache@v2
            const latest_release = await github.rest.repos.getLatestRelease({
              owner: "cyphar",
              repo: "libpathrs",
            });
            console.log(latest_release);
            return latest_release.data.tarball_url;
      - name: install libpathrs
        run: "echo skipped-for-baseline-isolation"
      - uses: actions/setup-go@v6
        with:
          cache: 'true'
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6

  build:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.18"
          - "1.19"
          - "1.20"
          - "1.21"
          - "1.22"
          - "1.23"
          # TODO: add 1.24 here once Go 1.26 is out.
          - oldstable
          - stable
        go-arch:
          - amd64
        os:
          - ubuntu-latest
        include:
          - go-version: stable
            go-arch: "386"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: 'true'
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: set GOARCH
        run: echo "GOARCH=${{ matrix.go-arch }}" >>"$GITHUB_ENV"
      - name: go build check
        run: "echo skipped-for-baseline-isolation"
      - name: go test build check
        run: go test -run none ./...

  windows:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.18"
          - "1.20"
          - "1.21"
          - "oldstable"
          - "stable"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: 'true'
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: mkdir gocoverdir
        # We can only use -test.gocoverdir for Go >= 1.20.
        if: ${{ matrix.go-version != '1.18' && matrix.go-version != '1.19' }}
        run: "echo skipped-for-baseline-isolation"
      - name: unit tests
        run: "echo skipped-for-baseline-isolation"
      - name: upload coverage artefact
        # We can only use -test.gocoverdir for Go >= 1.20.
        if: ${{ matrix.go-version != '1.18' && matrix.go-version != '1.19' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ env.GOCOVERDIR }}
      - name: collate coverage data for codecov
        if: ${{ env.GOCOVERDIR != '' }}
        run: "echo skipped-for-baseline-isolation"
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cyphar/filepath-securejoin

  unix:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.18"
          - "1.20"
          - "1.21"
          - "oldstable"
          - "stable"
        os:
          - ubuntu-latest
        include:
          # Make sure we test with a slightly older kernel (sadly we can't use
          # really old images like Ubuntu 18.04). Ubuntu 22.04 uses Linux 6.8.
          - go-version: "oldstable"
            os: ubuntu-22.04
          - go-version: "stable"
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: 'true'
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: mkdir gocoverdir
        # We can only use -test.gocoverdir for Go >= 1.20.
        if: ${{ matrix.go-version != '1.18' && matrix.go-version != '1.19' }}
        run: "echo skipped-for-baseline-isolation"
      - name: go test
        run: "echo skipped-for-baseline-isolation"
      - name: sudo go test
        run: "echo skipped-for-baseline-isolation"
      - name: upload coverage artefact
        # We can only use -test.gocoverdir for Go >= 1.20.
        if: ${{ matrix.go-version != '1.18' && matrix.go-version != '1.19' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ env.GOCOVERDIR }}
      - name: collate coverage data
        if: ${{ env.GOCOVERDIR != '' }}
        run: "echo skipped-for-baseline-isolation"
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cyphar/filepath-securejoin

  libpathrs:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.18"
          - "oldstable"
          - "stable"
        os:
          - ubuntu-22.04
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - name: find latest libpathrs release
        uses: actions/github-script@v8
        id: libpathrs-release-tarball
        with:
          result-encoding: string
          script: |-
            const latest_release = await github.rest.repos.getLatestRelease({
              owner: "cyphar",
              repo: "libpathrs",
            });
            console.log(latest_release);
            return latest_release.data.tarball_url;
      - name: install libpathrs
        run: "echo skipped-for-baseline-isolation"
      - uses: actions/setup-go@v6
        with:
          cache: 'true'
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: mkdir gocoverdir
        # We can only use -test.gocoverdir for Go >= 1.20.
        if: ${{ matrix.go-version != '1.18' && matrix.go-version != '1.19' }}
        run: "echo skipped-for-baseline-isolation"
      - name: go test
        run: "echo skipped-for-baseline-isolation"
      - name: sudo go test
        run: "echo skipped-for-baseline-isolation"
      - name: upload coverage artefact
        # We can only use -test.gocoverdir for Go >= 1.20.
        if: ${{ matrix.go-version != '1.18' && matrix.go-version != '1.19' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ env.GOCOVERDIR }}
      - name: collate coverage data
        if: ${{ env.GOCOVERDIR != '' }}
        run: "echo skipped-for-baseline-isolation"
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cyphar/filepath-securejoin

  coverage:
    runs-on: ubuntu-latest
    needs:
      - windows
      - unix
      - libpathrs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: 'true'
          go-version: "stable"
          check-latest: true
      - name: download all coverage
        uses: actions/download-artifact@v7
        with:
          path: coverage
      - name: generate coverage list
        run: "echo skipped-for-baseline-isolation"
      - name: compute coverage
        run: "echo skipped-for-baseline-isolation"
      - name: compute func coverage
        run: "echo skipped-for-baseline-isolation"
      - name: merge coverage
        run: "echo skipped-for-baseline-isolation"
      - name: upload merged coverage
        uses: actions/upload-artifact@v6
        with:
          name: fullcoverage-${{ github.job }}
          path: ${{ env.FULLCOVERAGE_FILE }}
      - name: upload coverage html
        uses: actions/upload-artifact@v6
        with:
          name: fullcoverage-${{ github.job }}.html
          path: ${{ env.FULLCOVERAGE_FILE }}.html

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install codespell==v2.4.1
      - run: "echo skipped-for-baseline-isolation"

  complete:
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - windows
      - unix
      - libpathrs
      - coverage
      - codespell
    steps:
      - run: "echo skipped-for-baseline-isolation"
